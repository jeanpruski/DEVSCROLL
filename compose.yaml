services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devscroll
      POSTGRES_USER: devscroll
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ['127.0.0.1:55432:5432']
    volumes: ['devscroll_local:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devscroll -d devscroll']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  devscroll_local:

name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devscroll_test
          POSTGRES_USER: devscroll
          POSTGRES_PASSWORD: test-only-password
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U devscroll -d devscroll_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://devscroll:test-only-password@localhost:5432/devscroll_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-not-a-deployed-secret-minimum-32-characters
      OWNER_EMAIL: ci@devscroll.local
      OWNER_PASSWORD: ci-only-password-not-used-in-production
      AI_PROVIDER: disabled
      AI_MONTHLY_BUDGET_CENTS: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run owner:create
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/devscroll-web.log 2>&1 &
      - run: node scripts/wait-web.mjs
      - run: npm run test:e2e
      - run: HTTP_TEST_URL=http://localhost:3000 npm test -- tests/backend-http.test.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: |
            playwright-report
            test-results

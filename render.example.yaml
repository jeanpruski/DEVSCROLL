# EXEMPLE À RELIRE : créer ces services implique des coûts d'hébergement.
# Aucun service n'a été créé. Choisir les plans et connecter un dépôt avant application.
services:
  - type: web
    name: devscroll-web
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - fromGroup: devscroll-private
  - type: worker
    name: devscroll-worker
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev
    startCommand: npm run worker
    autoDeployTrigger: off
    envVars:
      - fromGroup: devscroll-private
databases:
  - name: devscroll-postgres
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    databaseName: devscroll
    user: devscroll
    ipAllowList: []
    storageAutoscalingEnabled: false
envVarGroups:
  - name: devscroll-private
    envVars:
      - key: NODE_VERSION
        value: '22.19.0'
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: devscroll-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: AI_PROVIDER
        value: disabled
      - key: AI_MONTHLY_BUDGET_CENTS
        value: '0'
